name: TITAN One-Time Lockfile Refresh
on:
  push:
    branches:
      - work/titan-first-ten-contract-qa-20261023
jobs:
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Compute patched exact Next.js lockfile
        run: |
          npm install next@15.5.28 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
          echo 'BEGIN_LOCK_BASE64'
          base64 -w0 package-lock.json
          echo
          echo 'END_LOCK_BASE64'
