name: TITAN Offline Staging History Projection Safety

on:
  pull_request:
    paths:
      - 'scripts/titan-extract-staging-migration-versions.mjs'
      - 'tests/titan-extract-staging-migration-versions.test.mjs'
      - 'docs/TITAN_STAGING_HISTORY_OFFLINE_PROJECTION.md'
      - '.github/workflows/titan-offline-staging-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-synthetic-only:
    name: Verify offline psql capture projection (synthetic-only, no database)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact source-head checkout
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify synthetic offline capture and fail-closed CLI only
        run: node --test tests/titan-extract-staging-migration-versions.test.mjs

  disposable-postgres-integration:
    name: Verify native PostgreSQL probe to offline parser (synthetic-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: titan_offline_synthetic
          POSTGRES_USER: titan_offline
          POSTGRES_PASSWORD: synthetic_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U titan_offline -d titan_offline_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TITAN_SYNTHETIC_POSTGRES: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: titan_offline_synthetic
      PGUSER: titan_offline
      PGPASSWORD: synthetic_only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable exact PR source head
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native disposable-only PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Replay real SQL probe and offline extraction against disposable PostgreSQL 16
        run: node --test tests/titan-extract-staging-migration-versions.pg.mjs
