name: TITAN saved-design disposable PostgreSQL isolation
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261120_customer_saved_designs.sql'
      - 'tests/sql/customer-saved-designs-isolation.sql'
      - '.github/workflows/customer-saved-designs-postgres.yml'
  workflow_dispatch:
jobs:
  saved-design-owner-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: titan_synthetic
          POSTGRES_USER: titan
          POSTGRES_PASSWORD: synthetic_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U titan -d titan_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: titan
      PGPASSWORD: synthetic_only
      PGDATABASE: titan_synthetic
    steps:
      - uses: actions/checkout@v4
      - name: Install disposable PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Bootstrap synthetic Supabase identity and roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          create schema auth;
          create table auth.users(id uuid primary key);
          SQL
      - name: Apply unapplied saved-design migration to disposable DB only
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261120_customer_saved_designs.sql
      - name: Prove two-owner isolation, ACL and rollback
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/customer-saved-designs-isolation.sql
          test "$(psql -At -c 'select count(*) from private.customer_saved_designs')" = 0
          test "$(psql -At -c 'select count(*) from auth.users')" = 0
