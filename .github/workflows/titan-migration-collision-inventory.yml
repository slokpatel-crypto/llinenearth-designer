name: TITAN Read-only Migration Collision Inventory

on:
  pull_request:
    paths:
      - 'scripts/report-legacy-migration-prefixes.mjs'
      - 'tests/report-legacy-migration-prefixes.test.mjs'
      - '.github/workflows/titan-migration-collision-inventory.yml'
      - 'docs/TITAN_MIGRATION_COLLISION_INVENTORY.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-only:
    name: Collect migration collision evidence (NOT migration approval)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact event commit checkout
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove read-only inventory cannot approve a migration
        run: |
          node --check scripts/report-legacy-migration-prefixes.mjs
          node --test tests/report-legacy-migration-prefixes.test.mjs
      - name: Collect Git-tracked source inventory without database connection
        run: |
          node scripts/report-legacy-migration-prefixes.mjs --output "$RUNNER_TEMP/titan-migration-collisions.json" --reconciliation-output "$RUNNER_TEMP/titan-migration-source-rows.json"
          node -e 'const x=require(process.argv[1]);require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## Read-only migration inventory — NOT RELEASE APPROVAL\n\nTracked SQL: "+x.total_sql_files+"; eight-digit files: "+x.legacy_eight_digit_files+"; conflicting version groups: "+x.collision_group_count+".\n\nStaging history unverified. Release ready: "+x.release_ready+". No SQL applied.\n")' "$RUNNER_TEMP/titan-migration-collisions.json"
      - name: Retain non-authorizing source report
        uses: actions/upload-artifact@v4
        with:
          name: titan-read-only-migration-collision-inventory
          path: |
            ${{ runner.temp }}/titan-migration-collisions.json
            ${{ runner.temp }}/titan-migration-source-rows.json
          retention-days: 14
