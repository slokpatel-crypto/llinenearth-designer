name: Normalize npm lockfile

on:
  push:
    branches:
      - feature/style-director-agent
    paths:
      - "package.json"
      - ".github/workflows/normalize-lockfile.yml"

permissions:
  contents: write

concurrency:
  group: normalize-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts --include=optional --no-audit --no-fund

      - name: Validate lockfile JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('package-lock.json','utf8')); console.log('package-lock.json is valid')"

      - name: Commit normalized lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Normalize npm lockfile"
          git push
