name: TITAN J1 migration reconciliation regressions

on:
  pull_request:
    paths:
      - 'scripts/titan-reconcile-migration-history.mjs'
      - 'tests/titan-migration-history-reconcile.test.mjs'
      - '.github/workflows/titan-j1-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not attest synthetic tests of GitHub's PR merge ref as exact-head tests.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact source-head checkout
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify synthetic migration reconciliation invariants
        run: node --test tests/titan-migration-history-reconcile.test.mjs
