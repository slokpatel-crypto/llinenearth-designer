name: Regenerate root npm lockfile

on:
  push:
    branches:
      - feature/style-director-agent
    paths:
      - package.json
      - .github/workflows/regenerate-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/style-director-agent
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Verify clean install
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "llinen-earth-ci"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sync root npm lockfile"
          git push origin HEAD:feature/style-director-agent
