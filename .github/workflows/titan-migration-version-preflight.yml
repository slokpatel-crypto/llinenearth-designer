name: TITAN migration version fail-closed preflight
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/check_migration_versions.py'
      - 'scripts/test_migration_versions.py'
      - '.github/workflows/titan-migration-version-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration-version-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify synthetic duplicate/malformed/empty inventory regressions
        run: python3 -m unittest scripts.test_migration_versions -v
      - name: Fail closed on actual duplicate migration versions
        run: python3 scripts/check_migration_versions.py supabase/migrations
