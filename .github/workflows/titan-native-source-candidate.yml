                     0 <= row["measuredMidpointGapMm"] <= 80 for row in trial["trialSegments"])
          assert type(trial["bridgeToOriginalBodyBVHPairs"]) is int and trial["bridgeToOriginalBodyBVHPairs"] >= 0
          assert trial["openSourceBoundaryEdgesBeforeBridge"] == base["researchOnlyCombinedMesh"]["afterWeldOpenEdges"] == 132
          assert trial["openSourceBoundaryEdgesAfterBridge"] < 132
          assert trial["actualReductionOpenEdges"] == 132 - trial["openSourceBoundaryEdgesAfterBridge"]
          assert trial["degenerateFaces"] == trial["nonManifoldEdges"] == 0
          print("TITAN_REAL_FOUR_EDGE_CROTCH_BRIDGE_MEASURED_NEVER_PRODUCTION_APPROVED",json.dumps({
              "trialTriangles":trial["trialAddedBridgeTriangles"],
              "boundaryEdgesRemaining":trial["openSourceBoundaryEdgesAfterBridge"],
              "newBridgeToBodyBVHPairs":trial["bridgeToOriginalBodyBVHPairs"],
              "hardPhysicalBlockers":physical["rejectionReasonCount"],
              "productionApproved":False,
          }))
          PY
      - name: Trial scanned-body 7mm centroid clearance on non-export crotch bridge only
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background .cache/linen-earth/titan-research-crotch-stages.blend \
            --python-exit-code 1 --python scripts/blender/prototype-crotch-unmatched-source-bridge.py -- \
            --experimental-centroid-clearance-mm 7 \
            --output "$RUNNER_TEMP/titan-candidate-evidence/crotch-bridge-centroid-clearance-research-only.json"
          python3 - "$RUNNER_TEMP/titan-candidate-evidence/crotch-bridge-centroid-clearance-research-only.json" \
                     "$RUNNER_TEMP/titan-candidate-evidence/crotch-unmatched-bridge-research-only.json" \
                     "$RUNNER_TEMP/titan-candidate-evidence/rejection-report.json" <<'PY'
          import json
          import sys
          import math
          from pathlib import Path
          offset, original, physical = [json.loads(Path(p).read_text(encoding="utf8")) for p in sys.argv[1:]]
          assert all(x["modelIdentityId"] == "linen-earth-studio-model-v1" for x in (offset,original,physical))
          assert all(x["candidateOnly"] is True and x["productionApproved"] is False
                     for x in (offset,original,physical))
          assert physical["rejectionReasonCount"] == 10 and physical["preflightReady"] is False
          assert offset["physicalFitApproved"] is False and offset["sewnGarmentApproved"] is False
          assert offset["changesProductionGeometry"] is False and offset["finalClothQAApproved"] is False
          assert original["researchOnlyCentroidClearanceTrial"] is None
          assert offset["trialAddedBridgeTriangles"] == original["trialAddedBridgeTriangles"] == 6
          assert offset["openSourceBoundaryEdgesAfterBridge"] == original["openSourceBoundaryEdgesAfterBridge"] == 126
          assert original["bridgeToOriginalBodyBVHPairs"] == offset["bridgeToOriginalBodyBVHPairs"] == 20
          for evidence in (original,offset):
              records=evidence["actualBodyContactByOriginalCutEdgePair"]
              assert len(records) == len(evidence["trialSegments"]) == 4
              assert sum(row["bridgeTriangles"] for row in records) == 6
              assert sum(row["originalBodyBVHPairs"] for row in records) == 20
              for row,segment in zip(records,evidence["trialSegments"]):
                  assert row["leftEdge"] == segment["leftEdge"]
                  assert row["rightEdge"] == segment["rightEdge"]
                  assert row["bridgeTriangles"] == segment["bridgeTriangles"]
                  assert type(row["originalBodyBVHPairs"]) is int and row["originalBodyBVHPairs"] >= 0
                  assert type(row["contactingBridgeFaceCount"]) is int
                  assert 0 <= row["contactingBridgeFaceCount"] <= row["bridgeTriangles"]
                  assert math.isfinite(row["bridgeFaceAreaMm2"]) and row["bridgeFaceAreaMm2"] > 0
                  assert math.isfinite(row["contactingBridgeFaceAreaMm2"])
                  assert 0 <= row["contactingBridgeFaceAreaMm2"] <= row["bridgeFaceAreaMm2"] + 0.0001
          assert original["actualBodyContactByOriginalCutEdgePair"] == offset["actualBodyContactByOriginalCutEdgePair"]
          trial = offset["researchOnlyCentroidClearanceTrial"]
          assert trial["testedOriginalBodyNormalOffsetMm"] == 7.0
          assert trial["originalBridgeTriangles"] == 6 and trial["triangulatedFanFaces"] == 18
          assert trial["newInteriorCentroidVertices"] == 6
          assert trial["originalCutEdgeBoundaryCount"] == trial["preservedCutEdgeBoundaryCount"]
          assert trial["originalBridgeBodyBVHPairs"] == 20
          assert type(trial["afterCentroidDisplacementBodyBVHPairs"]) is int
          assert trial["afterCentroidDisplacementBodyBVHPairs"] >= 0
          control=trial["equalTopologyControl"]
          candidate=trial["equalTopologyDisplaced"]
          assert control["triangles"] == candidate["triangles"] == 18
          assert candidate["bodyPolygonBVHPairs"] == trial["afterCentroidDisplacementBodyBVHPairs"]
          for part in (control,candidate):
              assert type(part["bodyPolygonBVHPairs"]) is int and part["bodyPolygonBVHPairs"] >= 0
              assert type(part["contactingBridgeTriangleCount"]) is int and 0 <= part["contactingBridgeTriangleCount"] <= 18
              assert math.isfinite(part["totalBridgeAreaMm2"]) and part["totalBridgeAreaMm2"] > 0
              assert math.isfinite(part["contactingBridgeAreaMm2"]) and part["contactingBridgeAreaMm2"] >= 0
              assert 0 <= part["contactingBridgeAreaFraction"] <= 1
              assert part["contactingBridgeAreaMm2"] <= part["totalBridgeAreaMm2"] + 0.0001
              assert part["degenerateFaces"] == 0 and part["productionApproved"] is False
          assert trial["strictBodyCollisionImprovementObserved"] is (
              candidate["bodyPolygonBVHPairs"] < control["bodyPolygonBVHPairs"])
          assert trial["strictContactedAreaImprovementObserved"] is (
              candidate["contactingBridgeAreaMm2"] < control["contactingBridgeAreaMm2"])
          radial=trial["equalTopologyRadial"]
          assert radial["triangles"] == control["triangles"] == candidate["triangles"] == 18
          assert radial["productionApproved"] is False and radial["degenerateFaces"] == 0
          assert math.isfinite(radial["contactingBridgeAreaMm2"])
          assert 0 <= radial["contactingBridgeAreaMm2"] <= radial["totalBridgeAreaMm2"] + 0.0001
          assert type(radial["bodyPolygonBVHPairs"]) is int and radial["bodyPolygonBVHPairs"] >= 0
          shifts=trial["radialCentroidDisplacementMm"]
          assert 0 <= shifts["minimum"] <= shifts["maximum"] <= 7.0
          assert shifts["moved"] + shifts["unchanged"] == 6
          assert trial["radialStrictContactedAreaImprovementObserved"] is (
              radial["contactingBridgeAreaMm2"] < control["contactingBridgeAreaMm2"])
          assert trial["radialStrictBodyPairImprovementObserved"] is (
              radial["bodyPolygonBVHPairs"] < control["bodyPolygonBVHPairs"])
          assert "unsigned" in trial["metricCaveat"]
          assert trial["degenerateFaces"] == trial["nonManifoldEdges"] == 0
          assert trial["productionApproved"] is False
          for x in trial["originalCentroidNearestBodyDistanceMm"].values():
              assert isinstance(x,(int,float)) and math.isfinite(x) and x >= 0
          targeted=offset["researchOnlyTargetedSeamRerouteTrial"]
          assert targeted["testedOffsetMm"] == 7.0
          assert targeted["preservedBoundaryEdgeCount"] == 4
          fixed=targeted["fixedBridgeBoundaryBodyRayEvidence"]
          assert fixed["boundaryEdgeCount"] == len(fixed["boundaryEdges"]) == 4
          assert fixed["originalSourceCutEdgeCount"] == fixed["experimentalConnectorCount"] == 2
          source_rows=[row for row in fixed["boundaryEdges"] if row["edgeKind"] == "originalSourceCutEdge"]
          connector_rows=[row for row in fixed["boundaryEdges"] if row["edgeKind"] == "experimentalConnector"]
          assert len(source_rows) == len(connector_rows) == 2
          assert fixed["perBoundaryEdgeNearestBodySampleCount"] == 7
          assert fixed["originalSourceEdgeSamplesUnderResearchSevenMm"] == sum(
              row["sampledInteriorPointsUnderResearchSevenMm"] for row in source_rows
          )
          assert fixed["sourceFixedBoundaryFailsSampledResearchSevenMm"] is (
              fixed["originalSourceEdgeSamplesUnderResearchSevenMm"] > 0
          )
          expected_cut_edges={tuple(sorted(pair)) for pair in (
              targeted["targetOriginalCutEdgePair"]["leftEdge"],
              targeted["targetOriginalCutEdgePair"]["rightEdge"],
          )}
          assert {tuple(sorted(row["boundaryVertexIndices"])) for row in source_rows} == expected_cut_edges
          for row in fixed["boundaryEdges"]:
              assert len(set(row["boundaryVertexIndices"])) == 2
              assert math.isfinite(row["edgeLengthMm"]) and row["edgeLengthMm"] > 0
              samples=row["sampledNearestBodyDistances"]
              assert len(samples) == fixed["perBoundaryEdgeNearestBodySampleCount"]
              assert [v["edgeFraction"] for v in samples] == [
                  0.125, 0.25, 0.375, 0.5, 0.625, 0.75, 0.875
              ]
              measured=[v["nearestBodyDistanceMm"] for v in samples]
              assert all(math.isfinite(d) and d >= 0 for d in measured)
              assert all(type(v["nearestBodyPolygonIndex"]) is int and
                         v["nearestBodyPolygonIndex"] >= 0 for v in samples)
              assert row["sampledMinimumBodyDistanceMm"] == min(measured)
              assert row["sampledMaximumBodyDistanceMm"] == max(measured)
              assert row["sampledInteriorPointsUnderResearchSevenMm"] == sum(d < 7 for d in measured)
              assert type(row["strictInteriorRayHit"]) is bool
              if row["strictInteriorRayHit"]:
                  assert type(row["bodyPolygonIndex"]) is int and row["bodyPolygonIndex"] >= 0
                  assert math.isfinite(row["firstHitDistanceFromEdgeStartMm"])
                  assert 0 < row["firstHitDistanceFromEdgeStartMm"] < row["edgeLengthMm"]
              else:
                  assert row["bodyPolygonIndex"] is None
                  assert row["firstHitDistanceFromEdgeStartMm"] is None
          assert fixed["originalSourceCutEdgeInteriorRayHits"] == sum(
              row["strictInteriorRayHit"] for row in source_rows
          )
          assert fixed["experimentalConnectorInteriorRayHits"] == sum(
              row["strictInteriorRayHit"] for row in connector_rows
          )
          assert fixed["originalSourceCutEdgeHitMakesFixedBoundaryClearanceImpossible"] is (
              fixed["originalSourceCutEdgeInteriorRayHits"] > 0
          )
          assert fixed["productionApproved"] is False
          source_offset=targeted["researchOnlySourceCutEdgeReprojectionTrial"]
          assert source_offset["researchOnly"] is True
          assert source_offset["testedNormalOffsetMm"] == 7
          assert source_offset["sourceBoundaryVertexIndices"] == targeted["targetSourceBoundaryVertices"]
          assert {tuple(sorted(edge)) for edge in source_offset["sourceCutEdgeVertexPairs"]} == expected_cut_edges
          assert source_offset["changesProductionGeometry"] is False
          assert source_offset["productionApproved"] is False
          assert source_offset["physicalFitApproved"] is False
          assert source_offset["sewnGarmentApproved"] is False
          source_variants=source_offset["equalTopologyVariants"]
          assert set(source_variants) == {"unchangedControl","positiveBodyNormal","negativeBodyNormal"}
          for name,row in source_variants.items():
              assert row["triangles"] == 4
              assert row["degenerateFaces"] == row["nonManifoldEdges"] == 0
              assert row["productionApproved"] is False
              assert row["sourceCutBoundaryCoordinatesChanged"] is (name != "unchangedControl")
              assert row["minSourceVertexDisplacementMm"] >= 0
              assert row["minSourceVertexDisplacementMm"] <= row["maxSourceVertexDisplacementMm"] <= 25
              if name == "unchangedControl":
                  assert row["maxSourceVertexDisplacementMm"] == 0
              else:
                  assert row["maxSourceVertexDisplacementMm"] > 0
              assert type(row["bodyBVHPairs"]) is int and row["bodyBVHPairs"] >= 0
              assert type(row["contactingTriangleCount"]) is int
              assert 0 <= row["contactingTriangleCount"] <= 4
              assert math.isfinite(row["totalBridgeAreaMm2"]) and row["totalBridgeAreaMm2"] > 0
              assert math.isfinite(row["contactingBridgeAreaMm2"])
              assert 0 <= row["contactingBridgeAreaMm2"] <= row["totalBridgeAreaMm2"] + 0.0001
              assert 0 <= row["contactingBridgeAreaFraction"] <= 1
              edge_rows=row["originalSourceEdgeMeasurements"]
              assert len(edge_rows) == 2
              assert {tuple(sorted(entry["originalSourceCutEdgeVertexIndices"]))
                      for entry in edge_rows} == expected_cut_edges
              assert row["sourceEdgeSamplesBelowSevenMm"] == sum(
                  entry["samplesBelowResearchSevenMm"] for entry in edge_rows
              )
              assert 0 <= row["sourceEdgeSamplesBelowSevenMm"] <= 14
              for entry in edge_rows:
                  assert math.isfinite(entry["researchEdgeLengthMm"]) and entry["researchEdgeLengthMm"] > 0
                  readings=entry["sampledNearestOriginalBodyDistanceMm"]
                  assert len(readings) == 7
                  assert all(math.isfinite(d) and d >= 0 for d in readings)
                  assert entry["sampledMinimumOriginalBodyDistanceMm"] == min(readings)
                  assert entry["samplesBelowResearchSevenMm"] == sum(d < 7 for d in readings)
          source_control=source_variants["unchangedControl"]
          assert source_control["sourceEdgeSamplesBelowSevenMm"] == 14
          assert source_offset["lowestSampledCutEdgeContactCandidate"] in {
              "positiveBodyNormal","negativeBodyNormal"
          }
          best=source_variants[source_offset["lowestSampledCutEdgeContactCandidate"]]
          assert source_offset["strictOriginalBodyPairImprovementObserved"] is (
              best["bodyBVHPairs"] < source_control["bodyBVHPairs"]
          )
          assert source_offset["strictOriginalBodyContactAreaImprovementObserved"] is (
              best["contactingBridgeAreaMm2"] < source_control["contactingBridgeAreaMm2"]
          )
          assert source_offset["strictSampledSevenMmImprovementObserved"] is (
              best["sourceEdgeSamplesBelowSevenMm"] < source_control["sourceEdgeSamplesBelowSevenMm"]
          )
          assert "No continuous" in source_offset["metricCaveat"]
          assert "zero rays does not prove clearance" in fixed["rayTestCaveat"]
          assert "do not certify continuous boundary clearance" in fixed["rayTestCaveat"]
          assert len(targeted["targetSourceBoundaryVertices"]) == 4
          assert len(set(targeted["targetSourceBoundaryVertices"])) == 4
          assert targeted["targetOriginalCutEdgePair"]["originalBodyBVHPairs"] == 17
          assert targeted["targetOriginalCutEdgePair"]["bridgeTriangles"] == 2
          assert targeted["changesProductionGeometry"] is False
          assert targeted["productionApproved"] is False
          assert targeted["physicalFitApproved"] is False
          assert targeted["sewnGarmentApproved"] is False
          variants=targeted["equalTopologyVariants"]
          assert set(variants) == {"unchangedControl","positiveBodyNormal","negativeBodyNormal"}
          for label,part in variants.items():
              assert part["triangles"] == 4
              assert type(part["bodyPolygonBVHPairs"]) is int and part["bodyPolygonBVHPairs"] >= 0
              assert 0 <= part["contactingTriangleCount"] <= 4
              assert math.isfinite(part["totalAreaMm2"]) and part["totalAreaMm2"] > 0
              assert math.isfinite(part["contactingAreaMm2"])
              assert 0 <= part["contactingAreaMm2"] <= part["totalAreaMm2"] + 0.0001
              assert 0 <= part["contactingAreaFraction"] <= 1
              assert part["degenerateFaces"] == part["nonManifoldEdges"] == 0
              assert part["productionApproved"] is False
          best=variants[targeted["lowestContactAreaDirection"]]
          targeted_control=variants["unchangedControl"]
          assert targeted["lowestContactAreaDirection"] in {"positiveBodyNormal","negativeBodyNormal"}
          assert targeted["strictContactAreaImprovementObserved"] is (
              best["contactingAreaMm2"] < targeted_control["contactingAreaMm2"])
          assert targeted["strictBodyPairImprovementObserved"] is (
              best["bodyPolygonBVHPairs"] < targeted_control["bodyPolygonBVHPairs"])
          assert "Any nonzero" in targeted["metricCaveat"]
          print("TITAN_REAL_CROTCH_BRIDGE_BODY_CLEARANCE_EXPERIMENT_MEASURED_NO_APPROVAL",json.dumps({
              "originalBridgeBodyPairs":original["bridgeToOriginalBodyBVHPairs"],
              "candidateBridgeBodyPairs":trial["afterCentroidDisplacementBodyBVHPairs"],
              "equal18TriangleControlPairs":trial["equalTopologyControl"]["bodyPolygonBVHPairs"],
              "equal18TriangleControlContactAreaMm2":trial["equalTopologyControl"]["contactingBridgeAreaMm2"],
              "equal18TriangleCandidateContactAreaMm2":trial["equalTopologyDisplaced"]["contactingBridgeAreaMm2"],
              "contactAreaReductionObserved":trial["strictContactedAreaImprovementObserved"],
              "radial18TriangleBodyPairs":radial["bodyPolygonBVHPairs"],
              "radial18TriangleContactedAreaMm2":radial["contactingBridgeAreaMm2"],
              "radialDisplacementMm":shifts,
              "originalCutSegmentBodyContacts":original["actualBodyContactByOriginalCutEdgePair"],
              "radialAreaReductionObserved":trial["radialStrictContactedAreaImprovementObserved"],
              "preservedCutBoundaryEdges":trial["preservedCutEdgeBoundaryCount"],
              "reducedBodyPairs":trial["strictBodyCollisionImprovementObserved"],
              "targetedWorstSourcePair":targeted["targetOriginalCutEdgePair"],
              "fixedBoundaryBodyRayEvidence":targeted["fixedBridgeBoundaryBodyRayEvidence"],
              "sourceCutEdgeReprojectionTrial":targeted["researchOnlySourceCutEdgeReprojectionTrial"],
              "targetedEqualTopologyVariants":variants,
              "targetedLowestContactAreaDirection":targeted["lowestContactAreaDirection"],
              "targetedContactAreaImprovementObserved":targeted["strictContactAreaImprovementObserved"],
              "productionApproved":False,
          }))
          PY
