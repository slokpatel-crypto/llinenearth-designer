name: TITAN — Real source candidate rejection evidence

on:
  pull_request:
    paths:
      - "scripts/blender/bootstrap-human-base-meshes.py"
      - "scripts/blender/prepare-linen-earth-body.py"
      - "scripts/blender/author-linen-earth-officewear.py"
      - "tests/leg-clearance-native-trial.test.ts"
      - "tests/right-hem-fit-trial.test.ts"
      - "scripts/blender/measure-waist-tuck-contact.py"
      - "scripts/blender/preflight-linen-earth-officewear.py"
      - "scripts/blender/diagnose-linen-earth-contact.py"
      - "tests/blender/test_real_contact_diagnostics.py"
      - "tests/blender/test_garment_modifier_contact_stages.py"
      - "scripts/blender/summarize-native-candidate-preflight.py"
      - "tests/python/test_native_candidate_preflight_summary.py"
      - ".github/workflows/titan-native-source-candidate.yml"
  push:
    branches: [main]
    paths:
      - "scripts/blender/prepare-linen-earth-body.py"
      - "scripts/blender/author-linen-earth-officewear.py"
      - "tests/leg-clearance-native-trial.test.ts"
      - "tests/right-hem-fit-trial.test.ts"
      - "scripts/blender/measure-waist-tuck-contact.py"
      - "scripts/blender/preflight-linen-earth-officewear.py"
      - "scripts/blender/diagnose-linen-earth-contact.py"
      - "tests/blender/test_real_contact_diagnostics.py"
      - "tests/blender/test_garment_modifier_contact_stages.py"
      - "scripts/blender/summarize-native-candidate-preflight.py"
      - ".github/workflows/titan-native-source-candidate.yml"

permissions:
  contents: read

jobs:
  source-candidate-rejection-not-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Unit-test the fail-closed native rejection report reader
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/python/test_native_candidate_preflight_summary.py
      - name: Fetch checksum-verified Blender 4.5.14
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --show-error --silent --retry 3 \
            --connect-timeout 30 --max-time 900 \
            "https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz" \
            --output "$RUNNER_TEMP/blender-4.5.14-linux-x64.tar.xz"
          echo "9ba871ff2ecd36526b77432745980b7e6664ecd0c7ca11c48849073dcfe06da3  $RUNNER_TEMP/blender-4.5.14-linux-x64.tar.xz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/titan-blender"
          tar -xf "$RUNNER_TEMP/blender-4.5.14-linux-x64.tar.xz" -C "$RUNNER_TEMP/titan-blender"
          echo "BLENDER_BIN=$RUNNER_TEMP/titan-blender/blender-4.5.14-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Verify world centering preserves parent/child body geometry
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 \
            --python tests/blender/test_body_world_centering.py
      - name: Verify actual sparse Blender garment plane section
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 \
            --python tests/blender/test_sparse_garment_plane_section.py
      - name: Verify real world-space diagnostic fixtures (not fit approval)
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 \
            --python tests/blender/test_real_contact_diagnostics.py
      - name: Verify garment body contact at each actual Blender modifier stage
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 \
            --python tests/blender/test_garment_modifier_contact_stages.py
      - name: Fetch official pinned CC0 source body bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/blender/bootstrap-human-base-meshes.py
          test -f .cache/linen-earth/blender-human-base-meshes-v1.4.1/linen-earth-source-provenance.json
      - name: Prepare exact body source and six candidate garment meshes
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 \
            --python scripts/blender/prepare-linen-earth-body.py -- \
            --asset-root .cache/linen-earth/blender-human-base-meshes-v1.4.1 \
            --output .cache/linen-earth/linen-earth-officewear-body-base.blend
          "$BLENDER_BIN" --background .cache/linen-earth/linen-earth-officewear-body-base.blend \
            --python-exit-code 1 --python scripts/blender/author-linen-earth-officewear.py -- \
            --output .cache/linen-earth/linen-earth-officewear-authored.blend
          test -s .cache/linen-earth/linen-earth-officewear-authored.blend
          "$BLENDER_BIN" --background .cache/linen-earth/linen-earth-officewear-body-base.blend \
            --python-exit-code 1 --python scripts/blender/author-linen-earth-officewear.py -- \
            --experimental-waist-refinement-level 0 \
            --experimental-waist-extra-clearance-mm 0 \
            --output .cache/linen-earth/linen-earth-officewear-waist-control.blend
          test -s .cache/linen-earth/linen-earth-officewear-waist-control.blend
      - name: Measure actual waist/tuck contacted face area for both real Blender candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/titan-candidate-evidence"
          "$BLENDER_BIN" --background .cache/linen-earth/linen-earth-officewear-waist-control.blend \
            --python-exit-code 1 --python scripts/blender/measure-waist-tuck-contact.py -- \
            --output "$RUNNER_TEMP/titan-candidate-evidence/waist-tuck-control.json"
          "$BLENDER_BIN" --background .cache/linen-earth/linen-earth-officewear-authored.blend \
            --python-exit-code 1 --python scripts/blender/measure-waist-tuck-contact.py -- \
            --output "$RUNNER_TEMP/titan-candidate-evidence/waist-tuck-refined.json"
          python3 - "$RUNNER_TEMP/titan-candidate-evidence/waist-tuck-control.json" \
                     "$RUNNER_TEMP/titan-candidate-evidence/waist-tuck-refined.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          original, refined = [json.loads(Path(p).read_text(encoding="utf-8")) for p in sys.argv[1:]]
          for candidate, level in ((original, 0), (refined, 1)):
              assert candidate["modelIdentityId"] == "linen-earth-studio-model-v1"
              assert candidate["waistRefinementLevel"] == level
              assert candidate["candidateOnly"] is True and candidate["productionApproved"] is False
              for key in ("bodyVsWaist", "shirtVsWaist"):
                  measured = candidate[key]
                  assert type(measured["polygonContactPairs"]) is int
                  assert measured["polygonContactPairs"] >= 0
                  assert measured["wholeLeftSurfaceAreaMm2"] > 0
                  assert measured["wholeRightSurfaceAreaMm2"] > 0
                  for side in ("Left", "Right"):
                      fraction = measured["contacting" + side + "FaceFraction"]
                      assert 0 <= fraction <= 1
          assert original["bodyVsWaist"]["polygonContactPairs"] == 122, "Pinned original waist baseline changed"
          assert refined["bodyVsWaist"]["polygonContactPairs"] == 0, "Targeted native waist fix regressed"
          assert refined["shirtVsWaist"]["polygonContactPairs"] == 0, "Default layered waist did not clear actual tuck"
          print("TITAN_REAL_PINNED_WAIST_CONTROL_VS_REFINEMENT_MEASURED")
          print("Original shirt-waist contact:", original["shirtVsWaist"])
          print("Refined shirt-waist contact:", refined["shirtVsWaist"])
          PY
      - name: Compare true extra waistband clearance against original tucked shirt (research only)
        shell: bash
        run: |
          set -euo pipefail
          # All three experiments use the SAME CC0 locked source, same 30mm
          # tucked hem, same 1.6mm thickness and one-level real waist mesh.
          # +3mm is the smallest fully preflight-verified candidate correction.
          # Retain an exact +0mm control and +6/+9mm research alternatives.
          for extra in 0 6 9; do
            "$BLENDER_BIN" --background .cache/linen-earth/linen-earth-officewear-body-base.blend \
              --python-exit-code 1 --python scripts/blender/author-linen-earth-officewear.py -- \
              --experimental-waist-extra-clearance-mm "$extra" \
              --output ".cache/linen-earth/titan-waist-layering-extra-${extra}mm.blend"
            "$BLENDER_BIN" --background ".cache/linen-earth/titan-waist-layering-extra-${extra}mm.blend" \
              --python-exit-code 1 --python scripts/blender/measure-waist-tuck-contact.py -- \
              --output "$RUNNER_TEMP/titan-candidate-evidence/waist-layering-extra-${extra}mm.json"
          done
          python3 - "$RUNNER_TEMP/titan-candidate-evidence" <<'PY'
          import json
          import sys
          from pathlib import Path
          location = Path(sys.argv[1])
          standard = json.loads((location / "waist-tuck-refined.json").read_text(encoding="utf-8"))
          assert standard["waistRefinementLevel"] == 1
          assert standard["experimentalWaistExtraClearanceMm"] == 3
          assert standard["waistAbsoluteClearanceMm"] == 10
          assert standard["bodyVsWaist"]["polygonContactPairs"] == 0
          assert standard["shirtVsWaist"]["polygonContactPairs"] == 0
          print("REAL_TUCK_LAYERING_STANDARD", standard["shirtVsWaist"])
          for extra in (0, 6, 9):
              report = json.loads((location / f"waist-layering-extra-{extra}mm.json").read_text(encoding="utf-8"))
              assert report["candidateOnly"] is True and report["productionApproved"] is False
              assert report["modelIdentityId"] == "linen-earth-studio-model-v1"
              assert report["waistRefinementLevel"] == 1
              assert report["experimentalWaistExtraClearanceMm"] == extra
              assert report["waistAbsoluteClearanceMm"] == 7 + extra
              assert report["bodyVsWaist"]["polygonContactPairs"] == 0
              assert report["shirtVsWaist"]["polygonContactPairs"] == (1507 if extra == 0 else 0)
              for key in ("bodyVsWaist", "shirtVsWaist"):
                  actual = report[key]
                  assert type(actual["polygonContactPairs"]) is int and actual["polygonContactPairs"] >= 0
                  for side in ("Left", "Right"):
                      coverage = actual[f"contacting{side}FaceFraction"]
                      assert isinstance(coverage, (int, float)) and 0 <= coverage <= 1
              assert report["shirtVsWaist"]["wholeLeftSurfaceAreaMm2"] == standard["shirtVsWaist"]["wholeLeftSurfaceAreaMm2"], (
                  "Waist-only experiment changed the real shirt mesh."
              )
              print(f"TITAN_REAL_TUCK_LAYERING_EXTRA_{extra}MM", json.dumps({
                  "bodyPairs": report["bodyVsWaist"]["polygonContactPairs"],
                  "shirtWaistPairs": report["shirtVsWaist"]["polygonContactPairs"],
                  "contactingShirtFaceAreaMm2": report["shirtVsWaist"]["contactingLeftFaceAreaMm2"],
                  "contactingWaistFaceAreaMm2": report["shirtVsWaist"]["contactingRightFaceAreaMm2"],
              }))
          print("TITAN_NATIVE_WAIST_LAYERING_COMPARISONS_VALIDATED_CANDIDATE_ONLY")
          PY
      - name: Record real contact and mesh topology before rejection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/titan-candidate-evidence"
          "$BLENDER_BIN" --background .cache/linen-earth/linen-earth-officewear-authored.blend \
            --python-exit-code 1 --python scripts/blender/diagnose-linen-earth-contact.py -- \
            --output "$RUNNER_TEMP/titan-candidate-evidence/contact-diagnostics.json"
          test -s "$RUNNER_TEMP/titan-candidate-evidence/contact-diagnostics.json"
          python3 - "$RUNNER_TEMP/titan-candidate-evidence/contact-diagnostics.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as source:
              report = json.load(source)
          names = (
              "ShirtTorsoFabric", "ShirtSleeveLFabric", "ShirtSleeveRFabric",
              "TrouserWaistFabric", "TrouserLegLFabric", "TrouserLegRFabric",
          )
          assert report["modelIdentityId"] == "linen-earth-studio-model-v1"
          assert report["candidateOnly"] is True and report["productionApproved"] is False
          assert report["physicalFitApproved"] is False
          assert report["signedProjectionIsInteriorTest"] is False
          assert tuple(report["panels"]) == names
          for metrics in report["panels"].values():
              bands = metrics["contactPairsByBodyHeightOctile"]
              assert len(bands) == 8 and all(type(n) is int and n >= 0 for n in bands)
              assert sum(bands) == metrics["bodyGarmentIntersectingTrianglePairs"]
              expected = ("selectedBodyShell", "afterSmoothing", "afterBodyClearance", "afterClothThickness")
              stages = metrics["actualModifierContactStages"]
              assert isinstance(stages, list) and len(stages) == 4
              for stage, label in zip(stages, expected):
                  assert stage["stage"] == label
                  assert type(stage["bodyIntersectionPairs"]) is int and stage["bodyIntersectionPairs"] >= 0
              assert type(metrics["evaluatedVertices"]) is int and metrics["evaluatedVertices"] > 0
              assert type(metrics["evaluatedTriangles"]) is int and metrics["evaluatedTriangles"] > 0
          print("TITAN_CONTACT_EVIDENCE_FAIL_CLOSED_VALIDATION_PASSED")
          PY
      - name: Produce real Blender rejection evidence, not an approved model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/titan-candidate-evidence"
          set +e
          "$BLENDER_BIN" --background .cache/linen-earth/linen-earth-officewear-authored.blend \
            --python-exit-code 1 --python scripts/blender/preflight-linen-earth-officewear.py \
            > "$RUNNER_TEMP/titan-candidate-evidence/preflight.log" 2>&1
          status=$?
          set -e
          python3 scripts/blender/summarize-native-candidate-preflight.py \
            --log "$RUNNER_TEMP/titan-candidate-evidence/preflight.log" \
            --exit-code "$status" \
            --output "$RUNNER_TEMP/titan-candidate-evidence/rejection-report.json"
      - name: Verify real targeted waist collision repair (candidate stays rejected)
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/titan-candidate-evidence/rejection-report.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          evidence = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert evidence["candidateOnly"] is True
          assert evidence["productionApproved"] is False
          assert evidence["modelIdentityId"] == "linen-earth-studio-model-v1"
          assert evidence["preflightReady"] is False
          contact = evidence["boundaryIntersections"]
          assert type(contact["bodyTrouserWaist"]) is int, "Waist must have actual BVH evidence"
          assert contact["bodyTrouserWaist"] == 0, (
              "One-level simple waist refinement did not clear true waist/body intersections: "
              + str(contact["bodyTrouserWaist"]))
          assert evidence["rejectionReasonCount"] <= 10, (
              "New hard physical failures offset the two measured waist collision repairs")
          assert contact["shirtTrouserTuck"] == 0, "Tucked shirt and real waist must not intersect"
          # Unmodified five real panels must retain or improve their original
          # world-space triangle-pair BVH counts at the same 0.5mm epsilon.
          original = {
              "bodyShirtTorso": 2724, "bodySleeveL": 428, "bodySleeveR": 396,
              "bodyTrouserLegL": 336, "bodyTrouserLegR": 358,
              "garmentLegToLeg": 89,
          }
          for name, previous in original.items():
              assert type(contact[name]) is int and contact[name] <= previous, (
                  name, contact[name], previous)
          print("TITAN_REAL_WAIST_BODY_COLLISION_REPAIRED_NOT_PRODUCTION_APPROVED")
          PY
      - name: Audit full unchanged physical preflight on extra waist layering trials
        shell: bash
        run: |
          set -euo pipefail
          for extra in 0 6 9; do
            log="$RUNNER_TEMP/titan-candidate-evidence/waist-layering-preflight-extra-${extra}mm.log"
            set +e
            "$BLENDER_BIN" --background ".cache/linen-earth/titan-waist-layering-extra-${extra}mm.blend" \
              --python-exit-code 1 --python scripts/blender/preflight-linen-earth-officewear.py \
              > "$log" 2>&1
            exitcode=$?
            set -e
            python3 scripts/blender/summarize-native-candidate-preflight.py \
              --log "$log" --exit-code "$exitcode" \
              --output "$RUNNER_TEMP/titan-candidate-evidence/waist-layering-preflight-extra-${extra}mm.json"
          done
          python3 - "$RUNNER_TEMP/titan-candidate-evidence" <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          standard = json.loads((root / "rejection-report.json").read_text(encoding="utf-8"))
          control = json.loads((root / "waist-layering-preflight-extra-0mm.json").read_text(encoding="utf-8"))
          for report in (control, standard):
              assert report["candidateOnly"] is True and report["productionApproved"] is False
              assert report["preflightReady"] is False
              assert report["modelIdentityId"] == "linen-earth-studio-model-v1"
              assert report["boundaryIntersections"]["bodyTrouserWaist"] == 0
          assert control["rejectionReasonCount"] == 11
          assert control["boundaryIntersections"]["shirtTrouserTuck"] == 1507
          assert standard["rejectionReasonCount"] == 10
          assert standard["boundaryIntersections"]["shirtTrouserTuck"] == 0
          # The measured target is anchored to the locked photographic
          # identity guide, not an assistant-selected fashion silhouette.
          target_waist_width_mm = 344.0
          control_width = control["identityFitMeasurementsMm"]["trouserWaistWidthMm"]
          standard_width = standard["identityFitMeasurementsMm"]["trouserWaistWidthMm"]
          assert abs(standard_width - target_waist_width_mm) <= abs(control_width - target_waist_width_mm), (
              "Layered trouser waist degrades the measured photographic guide width")
          for key in ("shirtShoulderWidthMm", "shirtWaistWidthMm", "rightHemWidthMm",
                      "sleeveCenterSpacingMm", "legCenterSpacingMm"):
              assert standard["identityFitMeasurementsMm"][key] == control["identityFitMeasurementsMm"][key], (
                  "Waist-only layering changed other photographic fit measurements", key)
          for name, original_count in control["boundaryIntersections"].items():
              if name not in ("shirtTrouserTuck", "bodyTrouserWaist"):
                  assert standard["boundaryIntersections"][name] <= original_count, (
                      "Waist-only fix worsened existing garment contacts", name)
          print("TITAN_REAL_TUCK_CONTROL_PHOTOGRAPHIC_FIT_MM", json.dumps(control["identityFitMeasurementsMm"]))
          print("TITAN_REAL_TUCK_DEFAULT_PHOTOGRAPHIC_FIT_MM", json.dumps(standard["identityFitMeasurementsMm"]))
          for extra in (6, 9):
              report = json.loads((root / f"waist-layering-preflight-extra-{extra}mm.json").read_text(encoding="utf-8"))
              assert report["modelIdentityId"] == "linen-earth-studio-model-v1"
              assert report["candidateOnly"] is True and report["productionApproved"] is False
              assert report["preflightReady"] is False
              assert report["boundaryIntersections"]["shirtTrouserTuck"] == 0
              assert report["boundaryIntersections"]["bodyTrouserWaist"] == 0
              assert report["rejectionReasonCount"] <= 10, "Additional waist layering introduced new physical failures"
              for name, original_count in control["boundaryIntersections"].items():
                  if name not in ("shirtTrouserTuck", "bodyTrouserWaist"):
                      assert report["boundaryIntersections"][name] <= original_count, (
                          "Non-waist body or fabric collisions regressed", name)
              print(f"TITAN_REAL_TUCK_EXTRA_{extra}MM_PHYSICAL_GUIDE_FIT", json.dumps({
                  "remainingHardPreflightReasons": report["rejectionReasonCount"],
                  "identityFitMeasurementsMm": report["identityFitMeasurementsMm"],
                  "zeroWaistVsBodyPairs": report["boundaryIntersections"]["bodyTrouserWaist"],
                  "zeroShirtVsWaistPairs": report["boundaryIntersections"]["shirtTrouserTuck"],
                  "productionApproved": report["productionApproved"],
              }))
          print("TITAN_TUCKED_LAYERING_FULL_PHYSICAL_PREFLIGHT_EVIDENCE_VALIDATED")
          PY
      - name: Compare actual default 5mm right hem against unchanged 0mm source control
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background .cache/linen-earth/linen-earth-officewear-body-base.blend \
            --python-exit-code 1 --python scripts/blender/author-linen-earth-officewear.py -- \
            --experimental-right-hem-taper-mm 0.0 \
            --output .cache/linen-earth/titan-right-hem-0mm-control.blend
          log="$RUNNER_TEMP/titan-candidate-evidence/right-hem-0mm-preflight.log"
          set +e
          "$BLENDER_BIN" --background .cache/linen-earth/titan-right-hem-0mm-control.blend \
            --python-exit-code 1 --python scripts/blender/preflight-linen-earth-officewear.py \
            > "$log" 2>&1
          exitcode=$?
          set -e
          python3 scripts/blender/summarize-native-candidate-preflight.py \
            --log "$log" --exit-code "$exitcode" \
            --output "$RUNNER_TEMP/titan-candidate-evidence/right-hem-0mm-preflight.json"
          python3 - "$RUNNER_TEMP/titan-candidate-evidence/right-hem-0mm-preflight.json" \
                     "$RUNNER_TEMP/titan-candidate-evidence/rejection-report.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          baseline, trial = [json.loads(Path(path).read_text(encoding="utf-8")) for path in sys.argv[1:]]
          for report in (baseline, trial):
              assert report["candidateOnly"] is True and report["productionApproved"] is False
              assert report["modelIdentityId"] == "linen-earth-studio-model-v1"
              assert report["preflightReady"] is False
              assert report["boundaryIntersections"]["bodyTrouserWaist"] == 0
              assert report["boundaryIntersections"]["shirtTrouserTuck"] == 0
          original_width = baseline["identityFitMeasurementsMm"]["rightHemWidthMm"]
          trial_width = trial["identityFitMeasurementsMm"]["rightHemWidthMm"]
          assert original_width > 92 and 36 <= trial_width <= 92
          assert trial_width < original_width, ("No real photographic right hem correction", original_width, trial_width)
          for key, original in baseline["boundaryIntersections"].items():
              assert trial["boundaryIntersections"][key] <= original, (
                  "A real garment collision became worse during hem correction",
                  key, trial["boundaryIntersections"][key], original)
          assert trial["rejectionReasonCount"] <= baseline["rejectionReasonCount"] - 1, (
              "Measured hem improvement did not reduce true hard preflight failures")
          old_asymmetry = baseline["identityFitMeasurementsMm"]["hemWidthAsymmetryMm"]
          new_asymmetry = trial["identityFitMeasurementsMm"]["hemWidthAsymmetryMm"]
          assert 0 <= new_asymmetry < old_asymmetry and new_asymmetry <= 14, (
              "Symmetric trouser hem adjustment must reduce real left/right width asymmetry",
              old_asymmetry, new_asymmetry)
          assert abs(trial_width - trial["identityFitMeasurementsMm"]["leftHemWidthMm"]) <= new_asymmetry + 0.02
          for key, original in baseline["identityFitMeasurementsMm"].items():
              if key not in ("rightHemWidthMm", "hemWidthAsymmetryMm"):
                  assert trial["identityFitMeasurementsMm"][key] == original, (
                      "Trial hem taper changed unrelated photographed fit dimensions", key)
          print("TITAN_REAL_RIGHT_HEM_TAPER_NATIVE_FIT_VALIDATED_CANDIDATE_ONLY", json.dumps({
              "originalRightHemWidthMm": original_width,
              "trialRightHemWidthMm": trial_width,
              "remainingHardPreflightFailures": trial["rejectionReasonCount"],
              "productionApproved": trial["productionApproved"],
          }))
          PY
      - name: Measure actual 7mm vs 10mm and 13mm source body-clearance for both leg shells
        shell: bash
        run: |
          set -euo pipefail
          for extra in 3 6; do
            "$BLENDER_BIN" --background .cache/linen-earth/linen-earth-officewear-body-base.blend \
              --python-exit-code 1 --python scripts/blender/author-linen-earth-officewear.py -- \
              --experimental-leg-extra-clearance-mm "$extra" \
              --output ".cache/linen-earth/titan-legs-extra-${extra}mm.blend"
            log="$RUNNER_TEMP/titan-candidate-evidence/leg-clearance-extra-${extra}mm.log"
            set +e
            "$BLENDER_BIN" --background ".cache/linen-earth/titan-legs-extra-${extra}mm.blend" \
              --python-exit-code 1 --python scripts/blender/preflight-linen-earth-officewear.py \
              > "$log" 2>&1
            status=$?
            set -e
            python3 scripts/blender/summarize-native-candidate-preflight.py \
              --log "$log" --exit-code "$status" \
              --output "$RUNNER_TEMP/titan-candidate-evidence/leg-clearance-extra-${extra}mm.json"
          done
          python3 - "$RUNNER_TEMP/titan-candidate-evidence" <<'PY'
          import json
          import math
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          baseline = json.loads((root / "rejection-report.json").read_text(encoding="utf-8"))
          assert baseline["candidateOnly"] is True and baseline["productionApproved"] is False
          assert baseline["modelIdentityId"] == "linen-earth-studio-model-v1"
          assert baseline["rejectionReasonCount"] == 10
          original = baseline["boundaryIntersections"]
          assert original["garmentLegToLeg"] == 89
          assert original["bodyTrouserLegL"] == 336
          assert original["bodyTrouserLegR"] == 358
          for extra in (3, 6):
              trial = json.loads((root / f"leg-clearance-extra-{extra}mm.json").read_text(encoding="utf-8"))
              assert trial["candidateOnly"] is True and trial["productionApproved"] is False
              assert trial["preflightReady"] is False
              assert trial["modelIdentityId"] == "linen-earth-studio-model-v1"
              assert set(trial["boundaryIntersections"]) == set(original)
              measured = trial["boundaryIntersections"]
              assert all(type(count) is int and count >= 0 for count in measured.values())
              for key, value in baseline["identityFitMeasurementsMm"].items():
                  actual = trial["identityFitMeasurementsMm"][key]
                  assert isinstance(actual, (int, float)) and math.isfinite(actual)
                  if key not in ("leftHemWidthMm", "rightHemWidthMm",
                                 "hemWidthAsymmetryMm", "legCenterSpacingMm"):
                      assert actual == value, ("Other locked photographic guide moved", key, value, actual)
              # Report experiments honestly. NEVER choose a variant by only
              # reducing one contact count; regressions disqualify promotion.
              regressions = {
                  key: count for key, count in measured.items()
                  if count > original[key]
              }
              print(f"TITAN_REAL_BODY_LEG_CLEARANCE_EXTRA_{extra}MM", json.dumps({
                  "waistBody": measured["bodyTrouserWaist"],
                  "shirtWaist": measured["shirtTrouserTuck"],
                  "bodyLeft": measured["bodyTrouserLegL"],
                  "bodyRight": measured["bodyTrouserLegR"],
                  "legLeg": measured["garmentLegToLeg"],
                  "originalBodyLeft": original["bodyTrouserLegL"],
                  "originalBodyRight": original["bodyTrouserLegR"],
                  "originalLegLeg": original["garmentLegToLeg"],
                  "photographicMeasurementsMm": trial["identityFitMeasurementsMm"],
                  "remainingPhysicalBlockers": trial["rejectionReasonCount"],
                  "contactRegressions": regressions,
                  "safeToAutoPromote": False,
              }))
          print("TITAN_REAL_LEG_CLEARANCE_NATIVE_TRIALS_MEASURED_NO_AUTO_PROMOTION")
          PY
      - name: Upload rejection report, never an unapproved model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-native-candidate-evidence
          path: |
            ${{ runner.temp }}/titan-candidate-evidence/rejection-report.json
            ${{ runner.temp }}/titan-candidate-evidence/leg-clearance-extra-*mm.json
            ${{ runner.temp }}/titan-candidate-evidence/right-hem-0mm-preflight.json
            ${{ runner.temp }}/titan-candidate-evidence/waist-tuck-control.json
            ${{ runner.temp }}/titan-candidate-evidence/waist-tuck-refined.json
            ${{ runner.temp }}/titan-candidate-evidence/waist-layering-extra-*mm.json
            ${{ runner.temp }}/titan-candidate-evidence/waist-layering-preflight-extra-*mm.json
            ${{ runner.temp }}/titan-candidate-evidence/contact-diagnostics.json
            ${{ runner.temp }}/titan-candidate-evidence/preflight.log
          if-no-files-found: ignore
          retention-days: 7
