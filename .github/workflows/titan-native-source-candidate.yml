                     "$RUNNER_TEMP/titan-candidate-evidence/rejection-report.json" <<'PY'
          import json
          import math
          import sys
          from pathlib import Path
          pairing, proximity, rejected = (json.loads(Path(p).read_text(encoding="utf-8")) for p in sys.argv[1:])
          assert all(x["modelIdentityId"]=="linen-earth-studio-model-v1" for x in (pairing,proximity,rejected))
          assert all(x["candidateOnly"] is True and x["productionApproved"] is False for x in (pairing,proximity,rejected))
          assert pairing["physicalFitApproved"] is False and pairing["changesProductionGeometry"] is False
          assert rejected["preflightReady"] is False and rejected["rejectionReasonCount"] == 10
          assert rejected["boundaryIntersections"]["garmentLegToLeg"] == proximity["actualFinalLegLegBVHPairs"] > 0
          left, right = pairing["pairedLeftEdgeCount"], pairing["pairedRightEdgeCount"]
          assert left == proximity["actualSourceBoundaryEdges"]["left"]["nearCenterlineBoundaryEdges"] > 0
          assert right == proximity["actualSourceBoundaryEdges"]["right"]["nearCenterlineBoundaryEdges"] > 0
          assert 0 <= pairing["mutualNearestEdgeCount"] <= min(left,right)
          unmatched = pairing["unmatchedOriginalSourceEdgeIndices"]
          for side, total in (("left", left), ("right", right)):
              indexes = unmatched[side]
              assert indexes == sorted(set(indexes))
              assert all(type(k) is int and 0 <= k < total for k in indexes)
              assert len(indexes) == total - pairing["mutualNearestEdgeCount"] == 4
          correspondences = pairing["mutualPairIndices"]
          assert len(correspondences) == pairing["mutualNearestEdgeCount"]
