name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --include=optional
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run quality
      - name: Verify Blender helper syntax without requiring a render farm
        run: python3 -m py_compile scripts/blender/*.py
      - run: npm test
      - run: npm run eval:engine
      - run: npm run eval:preview-performance
      - run: npm run release:check
      - name: Generate physical fabric calibration queue (unverified)
        run: |
          npm run fabric:calibration-worksheet
          test -s artifacts/fabric-calibration-worksheet.csv
      - name: Preserve operator fabric calibration worksheet
        uses: actions/upload-artifact@v4
        with:
          name: linen-earth-fabric-calibration-pending
          path: artifacts/fabric-calibration-worksheet.csv
          retention-days: 14
      - run: npm run build
      - name: Verify private operator production HTTP transport (synthetic)
        run: node scripts/verify-operator-private-transport-http.cjs
      - name: Verify private stock ledger HTTP response and creation IDs (synthetic)
        run: node scripts/verify-operator-stock-private-http.cjs
      - name: Verify signed optional production ledger failures (synthetic)
        run: node scripts/verify-operator-optional-evidence-http.cjs
      - name: Verify designer vault JSON bounds and private error logs (synthetic)
        run: node scripts/verify-designer-vault-boundary-http.cjs
      - name: Load immutable photographic regression baseline
        run: git fetch --depth=1 origin 5126ebb6f82179b7fe25106e71f234248af3a677
      - name: Install pinned browser verification runtime
        env:
          LINEN_BROWSER_QA_RUNTIME: /tmp/linen-browser-qa
        run: |
          npm install --prefix "$LINEN_BROWSER_QA_RUNTIME" --no-audit --no-fund playwright@1.63.0
          node "$LINEN_BROWSER_QA_RUNTIME/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify preview lifecycle, responsive Designer and Style Director
        env:
          LINEN_BROWSER_QA_RUNTIME: /tmp/linen-browser-qa
          LINEN_OPERATOR_SESSION_SECRET: creative-browser-qa-session-${{ github.run_id }}
        run: |
          mkdir -p artifacts/preview-lifecycle
          npm run start > artifacts/preview-lifecycle/server.log 2>&1 &
          preview_server_pid=$!
          trap 'kill "$preview_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/designer-studio > /dev/null; then break; fi
            sleep 1
          done
          # Run the 3D gate first: it is the largest production-asset contract and should fail fast
          # before the longer photographic/style lifecycle suite when a GLB regression is present.
          # The four real GLB pixel snapshots are slow on software WebGL (~4m
          # observed in CI); do not abort an otherwise passing scene after 5m.
          # This 12m cap does NOT relax the strict 20s native first-frame SLA.
          # Prototype-only mode exits after a lighter interactive smoke gate.
          node scripts/verify-stock-operator-browser.cjs
          timeout --signal=TERM --kill-after=10s 12m node scripts/verify-garment-viewer.cjs
          node scripts/verify-premium-atelier.cjs
          node scripts/verify-designer-advisor.cjs
          node scripts/verify-photo-form.cjs
          node scripts/verify-photo-craft.cjs
          node scripts/verify-creative-workflow.cjs
          node scripts/verify-preview-lifecycle.cjs
          node scripts/verify-style-director-lifecycle.cjs
          node scripts/verify-style-director-handoff.cjs
      - name: Save browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-lifecycle-browser
          path: artifacts/preview-lifecycle
          if-no-files-found: ignore
          retention-days: 14

  stock-reservation-postgres:
    name: Disposable PostgreSQL stock reservation invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: titan_synthetic
          POSTGRES_USER: titan
          POSTGRES_PASSWORD: synthetic_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U titan -d titan_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: titan
      PGPASSWORD: synthetic_only
      PGDATABASE: titan_synthetic
    steps:
      - uses: actions/checkout@v4
      - name: Install local disposable database client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Assert disposable PostgreSQL 17.6 matches target database major and minor
        run: |
          test "$PGDATABASE" = titan_synthetic
          test "$PGHOST" = 127.0.0.1
          psql -X -v ON_ERROR_STOP=1 -Atc \
            "select case when current_setting('server_version_num')::int=170006
              then 'PASS' else 'FAIL' end" | grep -qx PASS
      - name: Bootstrap synthetic-only PostgreSQL roles and physical stock schema
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          create extension if not exists pgcrypto;
          SQL
          for migration in \
            supabase/migrations/20261001_fabric_stock_ledger.sql \
            supabase/migrations/20261028_fabric_stock_provenance.sql \
            supabase/migrations/20261029_stock_reservation_provenance.sql \
            supabase/migrations/20261031_stock_reservation_concurrency_provenance.sql \
            supabase/migrations/20261102_stock_reservation_key_payload_binding.sql \
            supabase/migrations/20261102_stock_record_idempotency.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run actual SQL key replay, mismatch and rollback tests
        run: |
          {
            printf "set titan.synthetic_sql_test='enabled';\n"
            cat supabase/tests/20261102_stock_reservation_key_payload_binding.sql
          } | psql -v ON_ERROR_STOP=1
      - name: Verify manual stock request-key idempotency in disposable PostgreSQL
        run: |
          {
            printf "set titan.synthetic_sql_test='enabled';\n"
            cat supabase/tests/20261102_stock_record_idempotency.sql
          } | psql -v ON_ERROR_STOP=1
      - name: Verify manual stock request-key races across independent PostgreSQL sessions
        env:
          TITAN_SYNTHETIC_PG_TEST: enabled
        run: bash scripts/verify-stock-record-concurrent-pg.sh
      - name: Verify cross-action reserve versus stock adjustment cannot oversell fabric
        env:
          TITAN_SYNTHETIC_PG_TEST: enabled
        run: bash scripts/verify-stock-reserve-adjust-concurrent-pg.sh
      - name: Verify concurrent consumption, cut remainder release, and stock adjustment
        env:
          TITAN_SYNTHETIC_PG_TEST: enabled
        run: bash scripts/verify-stock-consume-adjust-concurrent-pg.sh
      - name: Verify simultaneous consume vs release closes reservation once in both orders
        env:
          TITAN_SYNTHETIC_PG_TEST: enabled
        run: bash scripts/verify-stock-close-race-concurrent-pg.sh
      - name: Verify rollback of pending receipt and reservation lets same-key retry commit once
        env:
          TITAN_SYNTHETIC_PG_TEST: enabled
        run: bash scripts/verify-stock-aborted-request-recovery-pg.sh
      - name: Confirm native test synthetic data rolled back
        run: |
          psql -v ON_ERROR_STOP=1 -Atc \
            "select case when count(*)=0 then 'PASS' else 'FAIL' end
             from private.fabric_stock_ledger
             where fabric_id like 'SYNTHETIC-TITAN-%'" | grep -qx PASS

  stock-postgrest-staging:
    name: Disposable PostgREST stock v3 API and role migration rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: titan_synthetic
          POSTGRES_USER: titan
          POSTGRES_PASSWORD: synthetic_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U titan -d titan_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: titan
      PGPASSWORD: synthetic_only
      PGDATABASE: titan_synthetic
      TITAN_SYNTHETIC_PG_TEST: enabled
      TITAN_POSTGREST_JWT_SECRET: synthetic-only-postgrest-m46-jwt-secret-20261102
    steps:
      - uses: actions/checkout@v4
      - name: Install local disposable database client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Assert disposable PostgreSQL 17.6 matches target database major and minor
        run: |
          test "$PGDATABASE" = titan_synthetic
          test "$PGHOST" = 127.0.0.1
          psql -X -v ON_ERROR_STOP=1 -Atc \
            "select case when current_setting('server_version_num')::int=170006
              then 'PASS' else 'FAIL' end" | grep -qx PASS
      - name: Bootstrap synthetic stock schema through v2, before migration
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          create role authenticator login noinherit password 'synthetic_only';
          grant anon, authenticated, service_role to authenticator;
          grant usage on schema public to anon, authenticated, service_role;
          create extension if not exists pgcrypto;
          SQL
          for migration in \
            supabase/migrations/20261001_fabric_stock_ledger.sql \
            supabase/migrations/20261028_fabric_stock_provenance.sql \
            supabase/migrations/20261029_stock_reservation_provenance.sql \
            supabase/migrations/20261031_stock_reservation_concurrency_provenance.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          # Capture the *original* reservation function BEFORE replacing it
          # with the stricter M53 payload-bound definition. This is disposable
          # CI, not a claim of a full Supabase backup or live restoration.
          test "$PGDATABASE" = titan_synthetic
          test "$PGHOST" = 127.0.0.1
          test "$TITAN_SYNTHETIC_PG_TEST" = enabled
          psql -X -v ON_ERROR_STOP=1 -Atc \
            "select pg_get_functiondef('public.fabric_stock_reserve_v2(text,numeric,text,text,text,text)'::regprocedure)" \
            > "$RUNNER_TEMP/titan-legacy-reserve-definition.sql"
          grep -qi 'create or replace function public.fabric_stock_reserve_v2' \
            "$RUNNER_TEMP/titan-legacy-reserve-definition.sql"
          sha256sum "$RUNNER_TEMP/titan-legacy-reserve-definition.sql" \
            > "$RUNNER_TEMP/titan-legacy-reserve-definition.sha256"
          psql -v ON_ERROR_STOP=1 -f \
            supabase/migrations/20261102_stock_reservation_key_payload_binding.sql
          # Confirm the migration really changed the saved body.
          psql -X -v ON_ERROR_STOP=1 -Atc \
            "select pg_get_functiondef('public.fabric_stock_reserve_v2(text,numeric,text,text,text,text)'::regprocedure)" \
            > "$RUNNER_TEMP/titan-reserve-upgraded.sql"
          if cmp -s "$RUNNER_TEMP/titan-legacy-reserve-definition.sql" \
                    "$RUNNER_TEMP/titan-reserve-upgraded.sql"; then
            echo "Reservation payload binding did not change the function" >&2
            exit 1
          fi
      - name: Verify read-only staging preflight blocks rollout before v3 migration
        run: |
          test "$PGDATABASE" = titan_synthetic
          test "$PGHOST" = 127.0.0.1
          psql -X -v ON_ERROR_STOP=1 -At -f scripts/stock-v3-readonly-preflight.sql |
            jq -e '.status=="BLOCKED" and
              (.checks|any(.function=="record_v3" and .installed==false))' >/dev/null
      - name: Start pinned real PostgREST server on disposable localhost
        run: |
          docker run -d --name titan-postgrest-m46 --network host \
            -e PGRST_DB_URI="postgres://authenticator:synthetic_only@127.0.0.1:5432/titan_synthetic" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$TITAN_POSTGREST_JWT_SECRET" \
            -e PGRST_SERVER_PORT=3017 \
            postgrest/postgrest:v12.2.3
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3017/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3017/ >/dev/null
          node scripts/verify-stock-postgrest-rpc.cjs before
      - name: Apply source-only stock v3 migration and reload actual schema cache
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261102_stock_record_idempotency.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261102_stock_write_readiness_v1.sql
          psql -v ON_ERROR_STOP=1 -c "notify pgrst, 'reload schema';"
          sleep 2
          psql -X -v ON_ERROR_STOP=1 -Atc \
            "select case when public.fabric_stock_write_ready_v1() is true
              and has_function_privilege('service_role',
                'public.fabric_stock_write_ready_v1()','EXECUTE')
              and not has_function_privilege('anon',
                'public.fabric_stock_write_ready_v1()','EXECUTE')
              and not has_function_privilege('authenticated',
                'public.fabric_stock_write_ready_v1()','EXECUTE')
             then 'PASS' else 'FAIL' end" | grep -qx PASS
      - name: Verify read-only staging preflight passes every function and privilege after v3
        run: |
          test "$PGDATABASE" = titan_synthetic
          test "$PGHOST" = 127.0.0.1
          psql -X -v ON_ERROR_STOP=1 -At -f scripts/stock-v3-readonly-preflight.sql |
            jq -e '.status=="READY" and .ledger_schema_present==true
              and (.checks|length)==5
              and (.checks|all(.installed and .security_definer and
                .fixed_search_path and .service_role_execute and
                .payload_binding_guard_present and
                (.anon_execute|not) and (.authenticated_execute|not)))' >/dev/null
      - name: Prove stock readiness fails closed on synthetic role and function drift
        run: |
          # Transactions guarantee the fixture restores itself after each
          # malicious or accidental catalog change. Never test on live data.
          test "$PGDATABASE" = titan_synthetic
          test "$PGHOST" = 127.0.0.1
          test "$TITAN_SYNTHETIC_PG_TEST" = enabled
          observed=$(psql -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          grant execute on function public.fabric_stock_record_v3(text,text,numeric,text,text,text,text) to authenticated;
          select case when public.fabric_stock_write_ready_v1() is false then 'grant-blocked' else 'FAIL' end;
          rollback;
          select case when public.fabric_stock_write_ready_v1() is true then 'grant-restored' else 'FAIL' end;
          begin;
          alter function public.fabric_stock_reserve_v2(text,numeric,text,text,text,text) security invoker;
          select case when public.fabric_stock_write_ready_v1() is false then 'invoker-blocked' else 'FAIL' end;
          rollback;
          select case when public.fabric_stock_write_ready_v1() is true then 'invoker-restored' else 'FAIL' end;
          begin;
          alter function public.fabric_stock_snapshot_v2(text[]) reset search_path;
          select case when public.fabric_stock_write_ready_v1() is false then 'path-blocked' else 'FAIL' end;
          rollback;
          select case when public.fabric_stock_write_ready_v1() is true then 'path-restored' else 'FAIL' end;
          begin;
          -- A fixed but unsafe path must fail just like a missing path.
          alter function public.fabric_stock_snapshot_v2(text[])
            set search_path=public,pg_temp;
          select case when public.fabric_stock_write_ready_v1() is false then 'temp-path-blocked' else 'FAIL' end;
          rollback;
          select case when public.fabric_stock_write_ready_v1() is true then 'temp-path-restored' else 'FAIL' end;
          SQL
          )
          expected=$'grant-blocked\ngrant-restored\ninvoker-blocked\ninvoker-restored\npath-blocked\npath-restored\ntemp-path-blocked\ntemp-path-restored'
          test "$observed" = "$expected"
      - name: Prove standalone staging preflight agrees with server search-path attestation
        run: |
          # The read-only staging SQL must BLOCK the same unsafe pg_temp
          # configuration the service-role readiness RPC refuses.
          test "$PGDATABASE" = titan_synthetic
          test "$PGHOST" = 127.0.0.1
          test "$TITAN_SYNTHETIC_PG_TEST" = enabled
          result=$(psql -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          alter function public.fabric_stock_snapshot_v2(text[])
            set search_path=public,pg_temp;
          \i scripts/stock-v3-readonly-preflight.sql
          rollback;
          \i scripts/stock-v3-readonly-preflight.sql
          SQL
          )
          printf '%s\n' "$result" | jq -s -e \
            'length==2 and
             .[0].status=="BLOCKED" and
             (.[0].checks|any(.function=="snapshot_v2" and .fixed_search_path==false)) and
             .[1].status=="READY" and
             (.[1].checks|all(.fixed_search_path==true))' >/dev/null
      - name: Build isolated real Next stock API route
        run: |
          npm ci --include=optional
          npm run build
      - name: Verify Next operator API against real disposable PostgREST
        run: |
          node scripts/verify-stock-next-postgrest.cjs
          # M58 creates consume and release records whose request_key is
          # NULL. Deleting only keyed receipts/reservations would orphan those
          # genuine committed synthetic ledger events in the staging fixture.
          # This entire job runs on disposable localhost titan_synthetic.
          test "$PGDATABASE" = titan_synthetic
          test "$PGHOST" = 127.0.0.1
          test "$TITAN_SYNTHETIC_PG_TEST" = enabled
          # The built Next->PostgREST test creates two receipts, two
          # reservations, one consumption and two release events (including
          # unused reserved metres returned by the consumption).
          psql -v ON_ERROR_STOP=1 -Atc \
            "select case when
              count(*) filter (where event_type='receipt')=2 and
              count(*) filter (where event_type='reserve')=2 and
              count(*) filter (where event_type='consume')=1 and
              count(*) filter (where event_type='release')=2
              then 'PASS' else 'FAIL' end
             from private.fabric_stock_ledger
             where fabric_id='linen-plain-60-sky-blue'" | grep -qx PASS
          # Derive only M48/M56 synthetic reservation UUIDs from their
          # persistent keyed 'reserve' rows, then delete their linked
          # consume/release ledger entries together in one SQL statement.
          psql -v ON_ERROR_STOP=1 <<'SQL'
          with synthetic_reservations as materialized (
            select reservation_id from private.fabric_stock_ledger
            where request_key like 'SYNTH-M48-%'
              and event_type='reserve' and reservation_id is not null
          )
          delete from private.fabric_stock_ledger
          where request_key like 'SYNTH-M48-%'
             or reservation_id in (select reservation_id from synthetic_reservations);
          SQL
          # The real catalog ID is used for this isolated operator HTTP test
          # because the production boundary rejects fake IDs. The disposable
          # DB must have no orphan test rows for it before the next fixture.
          psql -v ON_ERROR_STOP=1 -Atc \
            "select case when count(*)=0 then 'PASS' else 'FAIL' end
             from private.fabric_stock_ledger
             where fabric_id='linen-plain-60-sky-blue'" | grep -qx PASS
          node scripts/verify-stock-postgrest-rpc.cjs after
      - name: Confirm actual PostgREST synthetic ledgers can be discarded
        run: |
          psql -v ON_ERROR_STOP=1 -Atc \
            "select case when count(*)=1 then 'PASS' else 'FAIL' end
             from private.fabric_stock_ledger
             where fabric_id like 'SYNTHETIC-TITAN-POSTGREST-%'" | grep -qx PASS
      - name: Prove legacy reservation body cannot pass stock rollout preflight even with v3 installed
        run: |
          # Isolated localhost only. Both functions exist and retain grants,
          # but legacy v2 fails to bind replay keys to physical cutting evidence.
          test "$PGDATABASE" = titan_synthetic
          test "$PGHOST" = 127.0.0.1
          test "$TITAN_SYNTHETIC_PG_TEST" = enabled
          (cd "$RUNNER_TEMP" && sha256sum -c titan-legacy-reserve-definition.sha256)
          psql -X -v ON_ERROR_STOP=1 -f \
            "$RUNNER_TEMP/titan-legacy-reserve-definition.sql"
          psql -X -v ON_ERROR_STOP=1 -At -f scripts/stock-v3-readonly-preflight.sql |
            jq -e '.status=="BLOCKED" and
              (.checks|any(.function=="reserve_v2" and
                .installed==true and .service_role_execute==true and
                .payload_binding_guard_present==false)) and
              (.checks|any(.function=="record_v3" and
                .installed==true and .payload_binding_guard_present==true))' >/dev/null
          # The privileged server cannot be tricked by the existence of
          # the older reservation function with the same signature/grants.
          psql -X -v ON_ERROR_STOP=1 -Atc \
            "select case when public.fabric_stock_write_ready_v1() is false
              then 'PASS' else 'FAIL' end" | grep -qx PASS
          # Reapply the source migration before the existing v3 rollback suite.
          psql -X -v ON_ERROR_STOP=1 -f \
            supabase/migrations/20261102_stock_reservation_key_payload_binding.sql
          psql -X -v ON_ERROR_STOP=1 -At -f scripts/stock-v3-readonly-preflight.sql |
            jq -e '.status=="READY" and
              (.checks|all(.payload_binding_guard_present==true))' >/dev/null
          psql -X -v ON_ERROR_STOP=1 -Atc \
            "select case when public.fabric_stock_write_ready_v1() is true
              then 'PASS' else 'FAIL' end" | grep -qx PASS
          psql -X -v ON_ERROR_STOP=1 -c "notify pgrst, 'reload schema';"
      - name: Rehearse v3 rollback and PostgREST cache invalidation without changing v2
        run: |
          psql -v ON_ERROR_STOP=1 -c "drop function public.fabric_stock_record_v3(text,text,numeric,text,text,text,text);"
          psql -v ON_ERROR_STOP=1 -c "notify pgrst, 'reload schema';"
          sleep 2
          node scripts/verify-stock-postgrest-rpc.cjs rolledback
          psql -v ON_ERROR_STOP=1 -Atc \
            "select case when to_regprocedure('public.fabric_stock_record_v3(text,text,numeric,text,text,text,text)') is null
                     and to_regprocedure('public.fabric_stock_record_v2(text,text,numeric,text,text,text)') is not null
                    then 'PASS' else 'FAIL' end" | grep -qx PASS
      - name: Restore exact original reservation definition and verify role isolation
        run: |
          # Revert both source-only stock changes on DISPOSABLE PG17:
          # v3 is already dropped; now restore the pre-upgrade v2 body.
          test "$PGDATABASE" = titan_synthetic
          test "$PGHOST" = 127.0.0.1
          test "$TITAN_SYNTHETIC_PG_TEST" = enabled
          (cd "$RUNNER_TEMP" && sha256sum -c titan-legacy-reserve-definition.sha256)
          psql -X -v ON_ERROR_STOP=1 -f \
            "$RUNNER_TEMP/titan-legacy-reserve-definition.sql"
          psql -X -v ON_ERROR_STOP=1 -Atc \
            "select pg_get_functiondef('public.fabric_stock_reserve_v2(text,numeric,text,text,text,text)'::regprocedure)" \
            > "$RUNNER_TEMP/titan-reserve-restored.sql"
          cmp "$RUNNER_TEMP/titan-legacy-reserve-definition.sql" \
              "$RUNNER_TEMP/titan-reserve-restored.sql"
          # The restored function must have the original service-only policy.
          psql -X -v ON_ERROR_STOP=1 -Atc \
            "select case when
               to_regprocedure('public.fabric_stock_record_v3(text,text,numeric,text,text,text,text)') is null
               and has_function_privilege('service_role',
                 'public.fabric_stock_reserve_v2(text,numeric,text,text,text,text)','EXECUTE')
               and not has_function_privilege('anon',
                 'public.fabric_stock_reserve_v2(text,numeric,text,text,text,text)','EXECUTE')
               and not has_function_privilege('authenticated',
                 'public.fabric_stock_reserve_v2(text,numeric,text,text,text,text)','EXECUTE')
               then 'PASS' else 'FAIL' end" | grep -qx PASS
          psql -X -v ON_ERROR_STOP=1 -c "notify pgrst, 'reload schema';"
          sleep 2
          node scripts/verify-stock-postgrest-rpc.cjs rolledback
          psql -X -v ON_ERROR_STOP=1 -At -f scripts/stock-v3-readonly-preflight.sql |
            jq -e '.status=="BLOCKED" and
              (.checks|any(.function=="record_v3" and .installed==false))' >/dev/null
          psql -X -v ON_ERROR_STOP=1 -Atc \
            "select case when public.fabric_stock_write_ready_v1() is false
              then 'PASS' else 'FAIL' end" | grep -qx PASS
          # Remove the M69 catalog-only guard during exact synthetic rollback.
          psql -X -v ON_ERROR_STOP=1 -c \
            "drop function public.fabric_stock_write_ready_v1();"
          psql -X -v ON_ERROR_STOP=1 -c "notify pgrst, 'reload schema';"
          psql -X -v ON_ERROR_STOP=1 -Atc \
            "select case when to_regprocedure('public.fabric_stock_write_ready_v1()') is null
              then 'PASS' else 'FAIL' end" | grep -qx PASS
      - name: Stop disposable PostgREST container
        if: always()
        run: docker rm -f titan-postgrest-m46 || true
