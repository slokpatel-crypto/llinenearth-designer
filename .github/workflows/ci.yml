name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --include=optional
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run quality
      - name: Verify Blender helper syntax without requiring a render farm
        run: python3 -m py_compile scripts/blender/*.py
      - name: Verify native 3D evidence integrity contracts without Blender
        run: python3 -m unittest discover -s scripts/blender -p 'test_*.py' -v
      - run: npm test
      - run: npm run eval:engine
      - run: npm run eval:preview-performance
      - run: npm run release:check
      - name: Generate physical fabric calibration queue (unverified)
        run: |
          npm run fabric:calibration-worksheet
          test -s artifacts/fabric-calibration-worksheet.csv
      - name: Preserve operator fabric calibration worksheet
        uses: actions/upload-artifact@v4
        with:
          name: linen-earth-fabric-calibration-pending
          path: artifacts/fabric-calibration-worksheet.csv
          retention-days: 14
      - run: npm run build
      - name: Load immutable photographic regression baseline
        run: git fetch --depth=1 origin 5126ebb6f82179b7fe25106e71f234248af3a677
      - name: Install pinned browser verification runtime
        env:
          LINEN_BROWSER_QA_RUNTIME: /tmp/linen-browser-qa
        run: |
          npm install --prefix "$LINEN_BROWSER_QA_RUNTIME" --no-audit --no-fund playwright@1.63.0
          node "$LINEN_BROWSER_QA_RUNTIME/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify preview lifecycle, responsive Designer and Style Director
        env:
          LINEN_BROWSER_QA_RUNTIME: /tmp/linen-browser-qa
          LINEN_OPERATOR_SESSION_SECRET: creative-browser-qa-session-${{ github.run_id }}
          LINEN_DESIGN_SHARE_SECRET: titan-local-share-http-fixture-${{ github.run_id }}-not-production
        run: |
          mkdir -p artifacts/preview-lifecycle
          # Separate local synthetic inventory only for HTTP/visual CI, never real stock proof.
          node scripts/ci-verified-stock-fixture.cjs > artifacts/preview-lifecycle/stock-fixture.log 2>&1 &
          fixture_pid=$!
          SUPABASE_URL=http://127.0.0.1:54324 SUPABASE_SECRET_KEY=sb_secret_titan_ci_fixture_only npm run start > artifacts/preview-lifecycle/server.log 2>&1 &
          preview_server_pid=$!
          trap 'kill "$preview_server_pid" "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/designer-studio > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-share-response-headers.cjs
          node scripts/verify-operator-private-response-headers.cjs
          node scripts/verify-operator-stock-audit-http.cjs
          # Run the 3D gate first: it is the largest production-asset contract and should fail fast
          # before the longer photographic/style lifecycle suite when a GLB regression is present.
          # The four real GLB pixel snapshots are slow on software WebGL (~4m
          # observed in CI); do not abort an otherwise passing scene after 5m.
          # This 12m cap does NOT relax the strict 20s native first-frame SLA.
          # Prototype-only mode exits after a lighter interactive smoke gate.
          timeout --signal=TERM --kill-after=10s 12m node scripts/verify-garment-viewer.cjs
          node scripts/verify-premium-atelier.cjs
          node scripts/verify-measurement-recovery.cjs
          node scripts/verify-designer-enquiry.cjs
          node scripts/verify-designer-advisor.cjs
          node scripts/verify-photo-form.cjs
          node scripts/verify-photo-craft.cjs
          node scripts/verify-creative-workflow.cjs
          node scripts/verify-designer-option-accuracy.cjs
          node scripts/verify-preview-lifecycle.cjs
          node scripts/verify-style-director-lifecycle.cjs
          node scripts/verify-style-director-handoff.cjs
      - name: Save browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-lifecycle-browser
          path: artifacts/preview-lifecycle
          if-no-files-found: ignore
          retention-days: 14
