name: TITAN Supabase Migration Version Inventory

# Read-only, baseline-drift gate. Passing is NOT permission for db push or
# proof that pre-existing duplicate versions can deploy through Supabase CLI.
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/audit-supabase-migration-versions.cjs'
      - 'scripts/test-supabase-migration-versions.cjs'
      - 'scripts/reconcile-supabase-migration-history.cjs'
      - 'scripts/test-supabase-migration-history.cjs'
      - 'docs/TITAN_SUPABASE_MIGRATION_BASELINE.json'
      - '.github/workflows/titan-supabase-migration-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-version-inventory:
    name: No-new migration collisions (legacy baseline, NOT deploy ready)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to prove the baseline against original immutable main commit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify migration-version guard and expected strict release block
        run: node --test scripts/test-supabase-migration-versions.cjs
      - name: Verify read-only staging migration-history reconciliation rejects legacy collisions
        run: node --test scripts/test-supabase-migration-history.cjs
      - name: Reject new version collisions or historical migration renames
        run: node scripts/audit-supabase-migration-versions.cjs --enforce-new --verify-git-baseline
      - name: Report historical blockers without applying migrations
        run: node scripts/audit-supabase-migration-versions.cjs --report
