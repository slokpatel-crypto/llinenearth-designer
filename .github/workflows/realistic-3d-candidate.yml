name: Realistic 3D Candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/blender/**"
      - "scripts/assemble-production-garment-scene.mjs"
      - "scripts/build-production-garment-model.mjs"
      - "scripts/evaluate-realistic-review.mjs"
      - "scripts/garment-import-tailoring-library.py"
      - "src/lib/garment-viewer-style-materials.ts"
      - "public/model-identity/**"
      - ".github/workflows/realistic-3d-candidate.yml"
  push:
    branches: [main]
    paths:
      - "scripts/blender/**"
      - "scripts/assemble-production-garment-scene.mjs"
      - "scripts/build-production-garment-model.mjs"
      - "scripts/evaluate-realistic-review.mjs"
      - "scripts/garment-import-tailoring-library.py"
      - "src/lib/garment-viewer-style-materials.ts"
      - "public/model-identity/**"
      - ".github/workflows/realistic-3d-candidate.yml"

concurrency:
  group: realistic-3d-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BLENDER_VERSION: "4.2.23"
      BLENDER_ROOT: "/tmp/blender-4.2.23-linux-x64"
    steps:
      - uses: actions/checkout@v4

      - name: Test actual UV, footwear and diagnostic release contracts without Blender
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_uv_*.py' -v
          python3 -m unittest discover -s tests -p 'test_footwear_fit_geometry.py' -v
          python3 -m unittest discover -s tests -p 'test_mobile_lod_probe_contract.py' -v

      - name: Install Blender 4.2 LTS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libx11-6 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0
          archive="/tmp/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl --fail --location --retry 3 --output "$archive"             "https://download.blender.org/release/Blender4.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          tar -xJf "$archive" -C /tmp
          echo "${BLENDER_ROOT}" >> "$GITHUB_PATH"
          "${BLENDER_ROOT}/blender" --version | head -n 2

      - name: Cache pinned realistic body source
        uses: actions/cache@v4
        with:
          path: .cache/linen-earth/blender-human-base-meshes-v1.4.1
          key: linen-earth-human-base-meshes-v1.4.1

      - name: Assemble realistic body and officewear candidate
        id: assemble
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/realistic-3d
          npm run garment:model-production:assemble 2>&1 | tee artifacts/realistic-3d/assembly.log

      - name: Capture production preflight report
        id: preflight
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          scene=".cache/linen-earth/linen-earth-officewear-authored.blend"
          test -f "$scene"
          blender --background --python-exit-code 1 "$scene" \
            --python scripts/blender/preflight-linen-earth-officewear.py -- \
            --json-output artifacts/realistic-3d/preflight.json \
            2>&1 | tee artifacts/realistic-3d/preflight.log

      - name: Probe mobile candidate from immutable source (diagnostic only)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          scene=".cache/linen-earth/linen-earth-officewear-authored.blend"
          if [ -f "$scene" ]; then
            blender --background --python-exit-code 1 "$scene" \
              --python scripts/blender/probe-mobile-lod.py -- \
              --output artifacts/realistic-3d/mobile-lod-diagnostic.json \
              --diagnostic-scene artifacts/realistic-3d/mobile-lod-unapproved.blend \
              2>&1 | tee artifacts/realistic-3d/mobile-lod-diagnostic.log
          else
            echo "No authored scene; mobile LOD diagnostic is unavailable."
          fi

      # This step must never be an export/promotion gate: independently probe
      # ALL post-Decimate mesh boundaries against the locked real body, even
      # when the separate six-panel 205k-triangle diagnostic itself passed.
      - name: Independently preflight mobile LOD (UNAPPROVED evidence only)
        id: mobile_independent_preflight
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          scene="artifacts/realistic-3d/mobile-lod-unapproved.blend"
          if [ ! -s "$scene" ]; then
            echo "No independently testable mobile diagnostic scene. No LOD approval."
            exit 0
          fi
          blender --background --python-exit-code 1 "$scene" \
            --python scripts/blender/preflight-linen-earth-officewear.py -- \
            --json-output artifacts/realistic-3d/mobile-lod-independent-preflight.json \
            2>&1 | tee artifacts/realistic-3d/mobile-lod-independent-preflight.log

      - name: Export mobile LOD GLB for LAB ONLY after independent BVH preflight
        id: mobile_lab_export
        if: always() && steps.mobile_independent_preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          scene="artifacts/realistic-3d/mobile-lod-unapproved.blend"
          report="artifacts/realistic-3d/mobile-lod-independent-preflight.json"
          test -s "$scene"
          test -s "$report"
          python3 - "$report" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          totals=data.get("totals") or {}
          assert data.get("ready") is True, "Independent full real-body Blender preflight is not green"
          assert (totals.get("triangles") or 10**9)<=220000, "Mobile triangle budget exceeded"
          assert (totals.get("vertices") or 10**9)<=280000, "Mobile vertex budget exceeded"
          PY
          blender --background --python-exit-code 1 "$scene" \
            --python scripts/blender/export-linen-earth-officewear.py -- \
            --lab-preview --output artifacts/realistic-3d/mobile-lod-LAB-UNAPPROVED.glb \
            2>&1 | tee artifacts/realistic-3d/mobile-lod-lab-export.log
          test -s artifacts/realistic-3d/mobile-lod-LAB-UNAPPROVED.glb
          echo "LAB-only diagnostic GLB exported, NOT approved for customer/production."

      - name: Upload early independent 3D blocking evidence
        if: always() && (steps.assemble.outcome != 'success' || steps.preflight.outcome != 'success')
        uses: actions/upload-artifact@v4
        with:
          name: linen-earth-3d-blocking-evidence
          path: |
            artifacts/realistic-3d/assembly.log
            artifacts/realistic-3d/preflight.log
            artifacts/realistic-3d/preflight.json
            artifacts/realistic-3d/mobile-lod-diagnostic.json
            artifacts/realistic-3d/mobile-lod-diagnostic.log
            artifacts/realistic-3d/mobile-lod-independent-preflight.json
            artifacts/realistic-3d/mobile-lod-independent-preflight.log
          if-no-files-found: warn
          retention-days: 14

      - name: Render unapproved scene for geometry diagnosis
        if: always() && (steps.assemble.outcome != 'success' || steps.preflight.outcome != 'success')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          scene="artifacts/realistic-3d/mobile-lod-unapproved.blend"
          # The immutable 903k source cannot provide a responsive preview on
          # software EEVEE, and its strict mobile polygon gate is still red.
          # Prefer the separately independent-BVH-checked disposable LOD for
          # geometry-only evidence. Never mistake it for the release master.
          if [ "${{ steps.mobile_independent_preflight.outcome }}" != "success" ] || [ ! -s "$scene" ]; then
            scene=".cache/linen-earth/linen-earth-officewear-authored.blend"
          fi
          if [ -s "$scene" ]; then
            mkdir -p artifacts/realistic-3d/review-unapproved
            printf '%s\n' 'UNAPPROVED GEOMETRY DIAGNOSTIC ONLY. Scene: %s. Workbench colours are not calibrated linen texture/drape or photo-realism. These images are not production or tailor acceptance evidence.\n' "$scene" > artifacts/realistic-3d/review-unapproved/UNAPPROVED.txt
            # EGL software WebGL/EEVEE/Workbench timed out even on independent
            # low-poly evidence. Project ALL evaluated REAL mesh triangles on
            # CPU to four depth-ordered SVGs; no display context or GPU needed.
            # Explicitly NOT a photoreal, cloth shader, studio or tailor gate.
            timeout --signal=TERM --kill-after=15s 4m \
              blender --background --python-exit-code 1 "$scene" \
              --python scripts/blender/diagnose-unapproved-cpu-silhouettes.py -- \
              --output-dir artifacts/realistic-3d/review-unapproved \
              --resolution-x 448 --resolution-y 600 --unapproved \
              2>&1 | tee artifacts/realistic-3d/review-unapproved.log
          else
            echo "No authored scene to visualize; production gates remain blocked."
          fi

      - name: Optional CPU-shaded four-angle real mobile model (UNAPPROVED)
        if: always() && steps.mobile_independent_preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          scene="artifacts/realistic-3d/mobile-lod-unapproved.blend"
          test -s "$scene"
          mkdir -p artifacts/realistic-3d/shaded-lod-UNAPPROVED
          # Software EGL hung even for Workbench. CPU Cycles is independent
          # of a GL screen; use a disposable low-poly GLB source and bounded
          # 3-sample shading for actual real-mesh visual evidence. This
          # is NOT final studio image parity, cloth-drape or fabric approval.
          timeout --signal=TERM --kill-after=15s 8m \
            blender --background --python-exit-code 1 "$scene" \
            --python scripts/blender/render-linen-earth-officewear-review.py -- \
            --output-dir artifacts/realistic-3d/shaded-lod-UNAPPROVED \
            --resolution-x 320 --resolution-y 480 --diagnostic-cycles-cpu \
            2>&1 | tee artifacts/realistic-3d/shaded-lod-UNAPPROVED.log
          for view in front three-quarter side back; do
            test -s "artifacts/realistic-3d/shaded-lod-UNAPPROVED/$view.png"
          done
          test -s artifacts/realistic-3d/shaded-lod-UNAPPROVED/UNAPPROVED-CPU-SHADED-REVIEW.txt

      - name: Render four-angle fit review
        id: render
        if: always() && steps.assemble.outcome == 'success' && steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -f .cache/linen-earth/linen-earth-officewear-authored.blend
          npm run garment:model-production:render-review 2>&1 | tee artifacts/realistic-3d/render-review.log

      - name: Verify garment and shoe visibility
        id: review_visibility
        if: always() && steps.render.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run garment:model-production:review-check

      - name: Export realistic lab-only GLB
        id: lab_export
        if: always() && steps.preflight.outcome == 'success' && steps.review_visibility.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -f .cache/linen-earth/linen-earth-officewear-authored.blend
          npm run garment:model-production:lab-export 2>&1 | tee artifacts/realistic-3d/lab-export.log
          test -s artifacts/realistic-3d/linen-earth-officewear-realistic-lab.glb

      - name: Write physical panel measurement worksheet
        id: measurement_worksheet
        if: always() && steps.assemble.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -f .cache/linen-earth/linen-earth-officewear-authored.blend
          npm run garment:model-production:measurement-worksheet
          test -s artifacts/realistic-3d/panel-measurement-worksheet.json

      - name: Prepare full-stock physical repeat, colour and drape measurement worksheet
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/generate-textile-measurement-worksheet.mjs
          test -s artifacts/realistic-3d/textile-measurement-worksheet.csv

      - name: Copy candidate scene and provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .cache/linen-earth/linen-earth-officewear-authored.blend ]; then
            cp .cache/linen-earth/linen-earth-officewear-authored.blend artifacts/realistic-3d/
          fi
          if [ -f .cache/linen-earth/blender-human-base-meshes-v1.4.1/linen-earth-source-provenance.json ]; then
            cp .cache/linen-earth/blender-human-base-meshes-v1.4.1/linen-earth-source-provenance.json artifacts/realistic-3d/
          fi

      - name: Preserve Blender crash evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/realistic-3d/crash-reports
          shopt -s nullglob
          for crash in /tmp/*.crash.txt .cache/linen-earth/*.crash.txt; do
            cp "$crash" "artifacts/realistic-3d/crash-reports/$(basename "$crash")"
          done

      - name: Upload realistic 3D candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linen-earth-realistic-3d-candidate
          path: artifacts/realistic-3d
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1

      - name: Enforce candidate gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "assembly=${{ steps.assemble.outcome }}"
          echo "preflight=${{ steps.preflight.outcome }}"
          echo "render=${{ steps.render.outcome }}"
          echo "review_visibility=${{ steps.review_visibility.outcome }}"
          echo "lab_export=${{ steps.lab_export.outcome }}"
          echo "measurement_worksheet=${{ steps.measurement_worksheet.outcome }}"
          test "${{ steps.assemble.outcome }}" = "success"
          test "${{ steps.preflight.outcome }}" = "success"
          test "${{ steps.render.outcome }}" = "success"
          test "${{ steps.review_visibility.outcome }}" = "success"
          test "${{ steps.lab_export.outcome }}" = "success"
          test "${{ steps.measurement_worksheet.outcome }}" = "success"
