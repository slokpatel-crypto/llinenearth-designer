[package]
name = "llinen-earth-os"
version = "0.1.0"
description = "LLinen Earth private operator system"
authors = ["LLinen Earth"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
